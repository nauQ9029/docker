services:
  database:
    image: mongo:7.0
    container_name: mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - todo-network

  web:
    build:
      context: .
      target: builder # Uses Stage 1 (builder) for local development with devDependencies
    container_name: nodejs-container
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_PORT=27017
      - DB_NAME=tododb
      - PORT=3000
      - NODE_ENV=development
    volumes:
      # Mount current directory to /usr/src/app in container
      - .:/usr/src/app
      # Ensure node_modules is not overwritten by host
      - /usr/src/app/node_modules
    depends_on:
      - database
    networks:
      - todo-network

volumes:
  mongo_data:

networks:
  todo-network:
    driver: bridge
